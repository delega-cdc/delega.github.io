<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API com JWT</title>
</head>
<body>

    <h1>Teste da API</h1>

    <button id="login">1. Fazer Login</button>
    <button id="mudarCor">2. Mudar Cor</button>

    <p id="mensagem">Faça o login primeiro.</p>

    <script>
        let token = "";

        document.getElementById("login").addEventListener("click", async function() {
            try {
                const resposta = await fetch("http://localhost:3000/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    token = dados.token;
                    document.getElementById("mensagem").textContent =
                        "Login realizado com sucesso!";
                } else {
                    document.getElementById("mensagem").textContent =
                        "Erro no login: " + dados.mensagem;
                }

            } catch (erro) {
                console.error(erro);
                document.getElementById("mensagem").textContent =
                    "Não foi possível conectar com a API.";
            }
        });

        document.getElementById("mudarCor").addEventListener("click", async function() {
            try {
                const resposta = await fetch("http://localhost:3000/api/cor", {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    document.body.style.backgroundColor = dados.cor;
                    document.getElementById("mensagem").textContent =
                        "Cor alterada! HTTP " + resposta.status;
                } else {
                    document.getElementById("mensagem").textContent =
                        dados.mensagem + " HTTP " + resposta.status;
                }

            } catch (erro) {
                console.error(erro);
                document.getElementById("mensagem").textContent =
                    "Erro ao conectar com a API.";
            }
        });
    </script>

</body>
</html>
